<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@2/modern-normalize.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <title>SIGNUP/SIGNIN FORM</title>
  </head>
  <body>
    <main class="main-section">
      <section class="main-card">
        <div class="form-links">
          <button class="signin">Sign In</button>
          <button onclick="window.location = './signup.html'" class="signup">
            Create account
          </button>
        </div>
        <h2 class="welcome-header">Welcome Back.</h2>
        <p class="welcome-text">
          Sign in to continue to your studio workspace.
        </p>
        <form class="input-section">
          <input
            class="email-input"
            type="email"
            name=""
            id=""
            placeholder="Email Address"
          />
          <div class="password-wrapper">
            <input
              class="password-input"
              type="password"
              name=""
              id=""
              placeholder="Password"
            />
            <button
              type="button"
              class="password-toggle"
              onclick="showPassword()"
            >
              Show
            </button>
          </div>
          <div class="forgotpass-div">
            <div class="check">
              <input type="checkbox" name="" id="" />
              <p>Keep me Sign in</p>
            </div>
            <div class="forgot-password">
              <p>Forgot Password?</p>
            </div>
          </div>
          <button class="submit-btn" type="submit">
            <span>Sign In</span>
            <i data-lucide="arrow-right" class="icon-arrow"></i>
          </button>
        </form>
        <div class="divider">
          <span>OR CONTINUE WITH</span>
        </div>
        <div class="socials">
          <div class="social-btn">
            <img
              src="https://cdn.simpleicons.org/google/4a443e"
              width="13"
              height="13"
              alt=""
            />
            <span>Google</span>
          </div>
          <div class="social-btn">
            <img
              src="https://cdn.simpleicons.org/github/4a443e"
              width="13"
              height="13"
              alt=""
            />
            <span>GitHub</span>
          </div>
          <div class="social-btn">
            <i data-lucide="lock"></i>
            <span>SSO</span>
          </div>
        </div>
        <div class="terms-section">
          By continuing you agree to our <a>Terms of Service</a> and
          <a>Privacy Policy</a>
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="scripts/script.js"></script>
  </body>
</html>
