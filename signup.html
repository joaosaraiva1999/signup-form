<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@2/modern-normalize.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <title>SIGNUP/SIGNIN FORM</title>
  </head>
  <body>
    <main class="main-section">
      <section class="main-card">
        <div class="form-links">
          <button onclick="window.location = './signin.html'" class="signin">
            Sign In
          </button>
          <button onclick="window.location = './signup.html'" class="signup">
            Create account
          </button>
        </div>
        <h2 class="welcome-header">Let's begin.</h2>
        <p class="welcome-text">
          Create an account — first 14 days on us, no card required.
        </p>
        <form class="input-section">
          <input
            class="full-name-input"
            type="text"
            name=""
            id=""
            placeholder="Full Name"
          />
          <input
            class="email-input"
            type="email"
            name=""
            id=""
            placeholder="Email Address"
          />
          <div class="password-wrapper">
            <input
              class="password-input"
              type="password"
              name=""
              id=""
              placeholder="Password"
            />
            <button
              type="button"
              class="password-toggle"
              onclick="showPassword()"
            >
              Show
            </button>
            <div class="pw-strength">
              <div class="pw-bar">
                <div class="pw-fill" id="pw-fill"></div>
              </div>
              <div class="pw-meta">
                <span id="pw-label">Weak</span>
                <span>Use 8+ chars, mix in numbers &amp; symbols</span>
              </div>
            </div>
          </div>
          <div class="password-wrapper">
            <input
              class="confirm-password-input"
              type="password"
              name=""
              id=""
              placeholder="Confirm password"
            />
          </div>
          <button class="submit-btn" type="submit">
            <span>Create account</span>
            <i data-lucide="arrow-right" class="icon-arrow"></i>
          </button>
        </form>
        <div class="divider">
          <span>OR CONTINUE WITH</span>
        </div>
        <div class="socials">
          <div class="social-btn">
            <img
              src="https://cdn.simpleicons.org/google/4a443e"
              width="13"
              height="13"
              alt=""
            />
            <span>Google</span>
          </div>
          <div class="social-btn">
            <img
              src="https://cdn.simpleicons.org/github/4a443e"
              width="13"
              height="13"
              alt=""
            />
            <span>GitHub</span>
          </div>
          <div class="social-btn">
            <i data-lucide="lock"></i>
            <span>SSO</span>
          </div>
        </div>
        <div class="terms-section">
          By continuing you agree to our <a>Terms of Service</a> and
          <a>Privacy Policy</a>
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="scripts/script.js"></script>
  </body>
</html>
